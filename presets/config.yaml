# ============================================================================
# PATHS
# ============================================================================
paths:
  documents_dir: "/home/hohla/git/SoSimple"
  data_dir: "/home/hohla/git/SoSimple/.knowledge-rag-data"
  models_cache_dir: "./models_cache"

# ============================================================================
# DOCUMENTS
# ============================================================================
documents:
  supported_formats:
    - .md
    - .txt
    - .py
    - .mqh
    - .mq4
    - .ipynb

  chunking:
    chunk_size: 1000
    chunk_overlap: 200

  # knowledge-rag 3.6.2 читает exclude_patterns из documents.
  # Паттерны приведены к формату, который реально проходит через fnmatch.
  exclude_patterns:
    - "MT/MQL5"
    - "MT/MQL5/**"
    - "MT/tester"
    - "MT/tester/**"
    - "MT/MQL4/Files"
    - "MT/MQL4/Files/**"
    - "MT/MQL4/Indicators"
    - "MT/MQL4/Indicators/**"
    - "MT/MQL4/Libraries"
    - "MT/MQL4/Libraries/**"
    - "MT/MQL4/Logs"
    - "MT/MQL4/Logs/**"
    - "MT/MQL4/Profiles"
    - "MT/MQL4/Profiles/**"
    - "MT/MQL4/Scripts"
    - "MT/MQL4/Scripts/**"
    - "MT/MQL4/Trash"
    - "MT/MQL4/Trash/**"
    - ".*"
    - "node_modules"
    - "dist"
    - "build"
    - "plots"
    - "checkpoints"
    - "archive"
    - "DATA"
    - "__pycache__"
    - "*.log"
    - "*.csv"
    - "*.parquet"
    - "*.pkl"
    - "*.pt"
    - "*.pth"
    - "*.bin"
    - "*.index"
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
    - "*.json"
    - "*.npy"

# ============================================================================
# MODELS
# ============================================================================
models:
  embedding:
    model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    dimensions: 384

  reranker:
    enabled: false
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    top_k_multiplier: 3

hybrid_alpha: 0.5

# ============================================================================
# SEARCH
# ============================================================================
search:
  default_results: 5
  max_results: 20
  collection_name: "knowledge_base"

# ============================================================================
# CATEGORIES
# ============================================================================
category_mappings:
  "wiki/research": "wiki_research"
  "wiki/concepts": "wiki_concepts"
  "docs/reports": "reports"
  "docs/superpowers": "plans"
  "docs/ML": "ml_docs"
  "docs/MT": "mt_docs"
  "docs/processing": "processing_docs"
  "docs/statistics": "statistics_docs"
  "ML": "ml"
  "API": "api"
  "MT/MQL4/Experts": "mql4"
  "MT/MQL4/Include": "mql4"
  "processing": "processing"
  "statistics": "statistics"
  "tests": "tests"

keyword_routes:
  wiki_research:
    - "research"
    - "исследование"
